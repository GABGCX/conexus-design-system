<!-- @dsCard group="Destaque" height=150 subtitle="Um por peça, no máximo: o ponto alto da página" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600&family=IBM+Plex+Sans:wght@400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--branco, #fff); }
  .wrap { padding: 34px 40px; }
  .block { background: var(--navy, #132844); border-radius: var(--radius-none, 0px); padding: 22px 26px; max-width: 340px; }
  .block p { margin: 0 0 6px; font-family: var(--font-display, "Sora", sans-serif); font-weight: 600; font-size: 19px; color: var(--branco, #fff); }
  .block .tag { font-family: var(--font-body, "IBM Plex Sans", sans-serif); font-weight: 400; font-size: 10.5px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--rotulo-sobre-navy, #7FA6C6); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="block">
      <p>Proposta em até 48 horas.</p>
      <div class="tag">Conexus</div>
    </div>
  </div>
</body>
</html>
