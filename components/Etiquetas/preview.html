<!DOCTYPE html>
<html>
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400&display=swap" rel="stylesheet">
<style>

  body { margin: 0; background: var(--branco, #fff); font-family: var(--font-body, "IBM Plex Sans", sans-serif); }
  .wrap { padding: 34px 40px; display: flex; gap: 10px; flex-wrap: wrap; }
  .tag { font-size: 13px; color: var(--corpo, #4C5867); border: 1px solid var(--borda-etiqueta, #D5DDE6); border-radius: var(--radius-none, 0px); padding: 8px 14px; }
  .tag.destaque { background: var(--navy, #132844); border-color: var(--navy, #132844); color: var(--branco, #fff); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="tag">Gerente de Projetos</div>
    <div class="tag">Analista de Negócios</div>
    <div class="tag">Dados e BI</div>
    <div class="tag destaque">Etiqueta em destaque</div>
  </div>
</body>
</html>
