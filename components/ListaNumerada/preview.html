<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;600&family=IBM+Plex+Sans:wght@400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--branco, #fff); font-family: var(--font-body, "IBM Plex Sans", sans-serif); }
  .wrap { padding: 30px 40px; }
  .item { display: flex; align-items: baseline; gap: 18px; padding: 14px 0; border-top: 1px solid var(--regua, #E4E9EF); }
  .item:first-child { border-top: none; }
  .num { font-family: var(--font-display, "Sora", sans-serif); font-weight: 300; font-size: 26px; color: var(--numero-lista, #C3CBD5); width: 34px; }
  .title { font-family: var(--font-display, "Sora", sans-serif); font-weight: 600; font-size: 16px; color: var(--texto-forte, #17202B); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="item"><div class="num">01</div><div class="title">Consultoria em Tecnologia</div></div>
    <div class="item"><div class="num">02</div><div class="title">Análise de Processos</div></div>
    <div class="item"><div class="num">03</div><div class="title">Desenvolvimento e Implantação</div></div>
  </div>
</body>
</html>
