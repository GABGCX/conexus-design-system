<!-- @dsCard group="Estrutura" height=190 subtitle="Abre capas e páginas de fechamento" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600&family=IBM+Plex+Sans:wght@400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-body, "IBM Plex Sans", sans-serif); }
  .wrap { display: flex; height: 100%; }
  .panel { flex: 1; padding: 28px 32px; display: flex; flex-direction: column; justify-content: center; }
  .panel + .panel { border-left: 1px solid var(--regua, #E4E9EF); }
  .on-light { background: var(--branco, #fff); }
  .on-navy { background: var(--navy, #132844); }
  .regua { width: 52px; height: 3px; margin-bottom: 14px; }
  .on-light .regua { background: var(--teal-conexus, #00A5B7); }
  .on-navy .regua { background: var(--teal-claro, #4FD1DE); }
  .caption { font-size: 11px; color: var(--apoio, #5C6878); margin-top: 16px; }
  .on-navy .caption { color: var(--texto-sobre-navy, #A8C2D8); }
  .label { font-family: var(--font-display, "Sora", sans-serif); font-weight: 600; font-size: 15px; color: var(--texto-forte, #17202B); }
  .on-navy .label { color: var(--branco, #fff); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="panel on-light">
      <div class="regua"></div>
      <div class="label">Régua de abertura</div>
      <div class="caption">Sobre fundo branco ou claro: cor teal-conexus.</div>
    </div>
    <div class="panel on-navy">
      <div class="regua"></div>
      <div class="label">Régua de abertura</div>
      <div class="caption">Sobre navy: cor teal-claro.</div>
    </div>
  </div>
</body>
</html>
