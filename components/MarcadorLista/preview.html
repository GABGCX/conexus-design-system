<!-- @dsCard group="Conteúdo" height=200 subtitle="Marcador teal, texto cinza escuro" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--branco, #fff); font-family: var(--font-body, "IBM Plex Sans", sans-serif); }
  .wrap { padding: 30px 40px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 12px; padding: 7px 0; font-size: 14.5px; color: var(--corpo, #4C5867); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--teal-conexus, #00A5B7); flex: none; }
  .sq { width: 8px; height: 8px; border-radius: var(--radius-none, 0px); background: var(--teal-conexus, #00A5B7); flex: none; }
  .note { font-size: 11px; color: var(--apoio, #5C6878); margin-top: 4px; }
</style>
</head>
<body>
  <div class="wrap">
    <ul>
      <li><span class="dot"></span>Marcador teal, texto cinza escuro</li>
      <li><span class="dot"></span>Duas colunas quando passa de quatro itens</li>
      <li><span class="sq"></span>Variante com quadrado, para destaques</li>
    </ul>
  </div>
</body>
</html>
